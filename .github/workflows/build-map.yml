name: Build map (Belarus)

# Запуск вручную: Actions -> Build map -> Run workflow.
# Результат: готовая структура PURRGO/MAPS/<имя>/ - её достаточно распаковать
# в корень microSD. Два способа забрать:
#   * artifact запуска: GitHub сам упаковывает его в один zip (внутри уже
#     PURRGO/MAPS/<имя>/..., без вложенного архива);
#   * GitHub Release "maps-<имя>" (опционально): zip + sim_report.txt.
# Дополнительно (run_sim) прогоняется sim_map_io.py - отчёт в Summary запуска
# и в artifact sim-report-<имя>.
on:
  workflow_dispatch:
    inputs:
      pbf_url:
        description: "URL .osm.pbf (Geofabrik)"
        required: true
        default: "https://download.geofabrik.de/europe/belarus-latest.osm.pbf"
      map_name:
        description: "Имя карты = имя папки на SD (латиница, строчные, без пробелов)"
        required: true
        default: "belarus"
      publish_release:
        description: "Выложить zip в GitHub Release (публичная ссылка без входа в GitHub)"
        type: boolean
        default: true
      run_sim:
        description: "После сборки прогнать sim_map_io.py (оценка времени загрузки экрана карты)"
        type: boolean
        default: true
      sim_points:
        description: "Точки для анализа: имя:lat:lon через запятую (должны лежать внутри карты)"
        required: false
        default: "Minsk:53.9006:27.5590,Gomel:52.4345:30.9754,Brest:52.0976:23.7341"

permissions:
  contents: write   # нужно только для шага Release

concurrency:
  group: build-map-${{ inputs.map_name }}
  cancel-in-progress: true

jobs:
  build-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MAP_NAME: ${{ inputs.map_name }}
      PBF_URL: ${{ inputs.pbf_url }}
      WORK: ${{ github.workspace }}/work
      TOOLS: ${{ github.workspace }}/tools/map-compiler
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Validate inputs
        run: |
          if ! [[ "$MAP_NAME" =~ ^[a-z0-9_-]{1,32}$ ]]; then
            echo "::error::map_name must match ^[a-z0-9_-]{1,32}$ (got '$MAP_NAME')"
            exit 1
          fi

      # .osm (XML) из PBF весит в ~10-15 раз больше самого PBF, место на
      # раннере ограничено - освобождаем то, что нам не нужно.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install osmium-tool
        run: sudo apt-get update && sudo apt-get install -y osmium-tool

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/map-compiler/requirements.txt

      - name: Install Python dependencies
        run: pip install -r tools/map-compiler/requirements.txt

      - name: Download PBF
        run: |
          mkdir -p "$WORK"
          curl -fL --retry 5 --retry-delay 10 -o "$WORK/source.osm.pbf" "$PBF_URL"
          ls -lh "$WORK/source.osm.pbf"

      - name: PBF -> OSM XML
        run: |
          osmium cat "$WORK/source.osm.pbf" -o "$WORK/raw.osm" --overwrite
          rm -f "$WORK/source.osm.pbf"
          ls -lh "$WORK/raw.osm"
          df -h /

      # Выход оптимизатора называем <map_name>.osm: компилятор берёт имя карты
      # (и имя выходной папки, и mapName в map.name) из имени входного файла.
      - name: Optimize OSM
        working-directory: tools/map-compiler
        run: |
          python purrgo_osm_optimizer.py "$WORK/raw.osm" "$WORK/$MAP_NAME.osm"
          rm -f "$WORK/raw.osm"
          ls -lh "$WORK/$MAP_NAME.osm"
          df -h /

      - name: Compile map
        working-directory: tools/map-compiler
        run: |
          python purrgo_map_compiler.py "$WORK/$MAP_NAME.osm"
          ls -lh "$TOOLS/$MAP_NAME"

      # Компилятор при ошибке (нет входного файла) завершается с кодом 0,
      # поэтому результат проверяем явно.
      - name: Verify output
        run: |
          out="$TOOLS/$MAP_NAME"
          for f in map.name roads.idx roads.mlp; do
            [ -s "$out/$f" ] || { echo "::error::missing or empty $f"; exit 1; }
          done
          cat "$out/map.name"; echo

      # Каталог stage/PURRGO/MAPS/<имя> - то, что распаковывается в корень SD.
      # Artifact ниже грузится из каталога (GitHub упакует его один раз),
      # а отдельный zip нужен только для Release.
      - name: Stage files and make ZIP
        run: |
          build_date="$(date -u +%Y-%m-%d)"
          zip_name="purrgo-map-$MAP_NAME-$build_date.zip"
          mkdir -p "$WORK/stage/PURRGO/MAPS"
          cp -r "$TOOLS/$MAP_NAME" "$WORK/stage/PURRGO/MAPS/$MAP_NAME"
          (cd "$WORK/stage" && zip -r -9 -q "$WORK/$zip_name" PURRGO)
          echo "BUILD_DATE=$build_date" >> "$GITHUB_ENV"
          echo "ZIP_NAME=$zip_name" >> "$GITHUB_ENV"
          ls -lh "$WORK/$zip_name"
          unzip -l "$WORK/$zip_name"

      - name: Upload map (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: purrgo-map-${{ env.MAP_NAME }}-${{ env.BUILD_DATE }}
          path: ${{ env.WORK }}/stage
          retention-days: 30
          if-no-files-found: error

      # Анализ не должен ронять сборку: карта уже готова и выложена выше.
      - name: Analyze load time (sim_map_io.py)
        id: sim
        if: ${{ inputs.run_sim }}
        continue-on-error: true
        timeout-minutes: 45
        working-directory: tools/map-compiler
        env:
          SIM_POINTS: ${{ inputs.sim_points }}
        run: |
          set -uo pipefail
          out="$WORK/sim_report.txt"
          map="$TOOLS/$MAP_NAME"
          : > "$out"

          # run <заголовок> <lat> <lon> <аргументы sim_map_io.py...>
          run() {
            local title="$1" lat="$2" lon="$3"; shift 3
            { echo; echo "### $title"
              python sim_map_io.py "$map" "$lat" "$lon" "$@"; } >> "$out"
          }

          S_MAIN="100,500,2000,5000,20000"
          S_JUMP="500,2000,5000"
          first=1
          IFS=',' read -ra PTS <<< "$SIM_POINTS"
          for pt in "${PTS[@]}"; do
            IFS=':' read -r name lat lon <<< "$pt"
            echo "## $name ($lat, $lon)" >> "$out"
            # U585 (SPI SD, 160 МГц) - целевая плата
            run "U585, SPI: как сейчас (с разбивкой idx/mlp/db)"  "$lat" "$lon" --scales "$S_MAIN" --breakdown
            run "U585, SPI: + CLMT (fast seek)"                  "$lat" "$lon" --scales "$S_MAIN" --fastseek
            run "U585, SPI: + CLMT + min-px 2"                   "$lat" "$lon" --scales "$S_MAIN" --fastseek --min-px 2
            run "U585, SPI: + CLMT + min-px 2 + кэш 256 (разбивка)" "$lat" "$lon" --scales "$S_MAIN" --fastseek --min-px 2 --cache 256 --breakdown
            run "U585, SPI: то же + чтение блоками 2 КБ"         "$lat" "$lon" --scales "$S_MAIN" --fastseek --min-px 2 --cache 256 --line 4
            # read-ahead по типам файлов: на малых масштабах блоки вредят (случайные сектора),
            # на больших помогают (последовательная геометрия)
            run "read-ahead: idx 1 / mlp 4 / db 1"               "$lat" "$lon" --scales "$S_MAIN" --fastseek --min-px 2 --cache 256 --line-mlp 4 --breakdown
            run "read-ahead: idx 1 / mlp 8 / db 1"               "$lat" "$lon" --scales "$S_MAIN" --fastseek --min-px 2 --cache 256 --line-mlp 8
            run "read-ahead: idx 4 / mlp 1 / db 1"               "$lat" "$lon" --scales "$S_MAIN" --fastseek --min-px 2 --cache 256 --line-idx 4
            # порог пропуска мелких объектов
            run "min-px 3 + read-ahead mlp 4"                    "$lat" "$lon" --scales "$S_MAIN" --fastseek --min-px 3 --cache 256 --line-mlp 4
            run "min-px 4 + read-ahead mlp 4"                    "$lat" "$lon" --scales "$S_MAIN" --fastseek --min-px 4 --cache 256 --line-mlp 4
            # прыжок follow (~81% экрана): второй кадр со сдвигом, кэш 32 против 256
            run "Follow-прыжок, кэш 32"                          "$lat" "$lon" --scales "$S_JUMP" --fastseek --min-px 2 --pan 0.81
            run "Follow-прыжок, кэш 256 (кадр уже в кэше)"       "$lat" "$lon" --scales "$S_JUMP" --fastseek --min-px 2 --pan 0.81 --cache 256
            # POI с иконками и подписями
            run "POI иконки + подписи"                           "$lat" "$lon" --scales "$S_JUMP" --fastseek --min-px 2 --poi-mode icons --labels 1
            # dev-плата для сравнения
            run "F411 SDIO (dev-плата), как сейчас"              "$lat" "$lon" --scales "$S_MAIN" --bus sdio --cpu 84
            # дальние масштабы - один раз, по первой точке
            if [ "$first" = 1 ]; then
              first=0
              run "Дальние масштабы, как сейчас"                 "$lat" "$lon" --scales "50000,200000,500000"
              run "Дальние масштабы, CLMT + min-px 2 + кэш 256"  "$lat" "$lon" --scales "50000,200000,500000" --fastseek --min-px 2 --cache 256
              run "Дальние масштабы, min-px 3 + read-ahead mlp 4"  "$lat" "$lon" --scales "50000,200000,500000" --fastseek --min-px 3 --cache 256 --line-mlp 4
            fi
          done

          {
            echo "## Оценка времени загрузки экрана карты (sim_map_io.py)"
            echo
            echo "Модель, а не замер на железе. Время: I/O и CPU, секунды, low/mid/high."
            echo '```'
            cat "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sim report
        if: ${{ always() && inputs.run_sim }}
        uses: actions/upload-artifact@v4
        with:
          name: sim-report-${{ env.MAP_NAME }}
          path: ${{ env.WORK }}/sim_report.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Publish to Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="maps-$MAP_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Map: $MAP_NAME" \
              --notes "Распаковать архив в корень microSD (создаст PURRGO/MAPS/$MAP_NAME)."
          fi
          gh release upload "$tag" "$WORK/$ZIP_NAME" --clobber
          if [ -s "$WORK/sim_report.txt" ]; then
            gh release upload "$tag" "$WORK/sim_report.txt" --clobber
          fi
          echo "### Скачать: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
